            <input type="text" id="st-mname" />
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-lname">Gender</label>
            <select id="st-gender" class="req2">
              <option value="" selected></option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;
              Please select a gender
            </span>
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-mname">Phone Number</label>
            <input type="tel" class="req" id="st-phone" />
            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;

            </span>
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-mname">Email Address</label>
            <input type="email" class="req" id="st-email" />
            <span class="error-msg">

            </span>
          </div>

            <label for="st-mname">Home Address</label>
            <input type="text" class="req" id="st-address" />
            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;
              Home address is required
            </span>
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-class">Class Assigned</label>
            <select id="st-class">
              <option value="" selected>Select class</option>
            </select>
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-state">State</label>
            <select id="st-state" class="req2">
              <option value="" selected></option>
            </select>
            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;
              Kindly select a state
            </span>
          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
            <label for="st-lga">L.G.A</label>
            <select id="st-lga" class="req2">
              <option value="" selected></option>
            </select>
            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;

            <span class="error-msg">
              <i class="fa fa-info-circle"></i>&nbsp;&nbsp;

          </div>

          <div class="input-con col-12 col-xs-12 col-sm-6 col-md-4 col-lg-4 col-xl-4">
