      var fileSize = file.size;
      if(fileSize > (1024 * 1024)) {
        fileSize = `${(fileSize / (1024 * 1024)).toFixed(2)}MB`

        fileSize = `${(fileSize / 1024).toFixed(2)}KB`

      }
      $(this).siblings(".custom-file-label").addClass("selected").html(`${fileName} (${fileSize})`);

    })

    $(".custom-file-input").on("change", function() {
      var file = $(this)[0].files[0];
      var fileName = file.name;
      var fileSize = file.size;
      if(fileSize > (1024 * 1024)) {
        fileSize = `${(fileSize / (1024 * 1024)).toFixed(2)}MB`
      }
      else if(fileSize > 1024) {
        fileSize = `${(fileSize / 1024).toFixed(2)}KB`
      } else {
        fileSize = `${fileSize}B`
      }
      $(this).siblings(".custom-file-label").addClass("selected").html(`${fileName} (${fileSize})`);
    });

    $("#emp_search").on('input', function() {
      let search = $("#emp_search").val().toLowerCase().trim()
      //console.log(search)

      var file = $(this)[0].files[0];
      var fileName = file.name;
      var fileSize = file.size;
      if(fileSize > (1024 * 1024)) {
        fileSize = `${(fileSize / (1024 * 1024)).toFixed(2)}MB`
      }
      else if(fileSize > 1024) {
        fileSize = `${(fileSize / 1024).toFixed(2)}KB`
      } else {
        fileSize = `${fileSize}B`
      }
      $(this).siblings(".custom-file-label").addClass("selected").html(`${fileName} (${fileSize})`);
    });

              <div class="w-small w-text-gray"><i>
                When enabled, the <b>UNPAID</b> salary of <b>ACTIVE</b> staff for <b>THAT MONTH</b> will be paid automatically on the specified date (payroll date). The amount will be deducted from your wallet balance. In case of 
                insufficient balance, the payments will not be made. <br>
                When disabled, you will be notified via email on the specified date (payroll date) as a reminder to pay your staff salaries.

              <div class="w-small w-text-gray"><i>

      var file = $(this)[0].files[0];
      var fileName = file.name;
      var fileSize = file.size;
      if(fileSize > (1024 * 1024)) {
        fileSize = `${(fileSize / (1024 * 1024)).toFixed(2)}MB`
      }
      else if(fileSize > 1024) {
        fileSize = `${(fileSize / 1024).toFixed(2)}KB`
      } else {
        fileSize = `${fileSize}B`
      }
      $(this).siblings(".custom-file-label").addClass("selected").html(`${fileName} (${fileSize})`);
    });
